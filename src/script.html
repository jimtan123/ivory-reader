<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const LETTERS=['C','D','E','F','G','A','B'];
const SEMI={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const PC_NAME=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const isBlack=m=>[1,3,6,8,10].includes(m%12);
const noteName=m=>PC_NAME[m%12]+(Math.floor(m/12)-1);
const letterOf=m=>PC_NAME[m%12][0];
const midi=(letter,oct)=>(oct+1)*12+SEMI[letter];
const diaLO=(letter,oct)=>oct*7+LETTERS.indexOf(letter);
const dia=m=>diaLO(letterOf(m),Math.floor(m/12)-1);
function naturalsBetween(lo,hi){const out=[];for(let m=lo;m<=hi;m++)if(!isBlack(m))out.push(m);return out;}
const POOL={
  treble:{staff:naturalsBetween(midi('E',4),midi('F',5)),ledger:naturalsBetween(midi('C',4),midi('A',5))},
  bass:{staff:naturalsBetween(midi('G',2),midi('A',3)),ledger:naturalsBetween(midi('E',2),midi('C',4))}
};
const KB_RANGE={treble:[midi('C',4),midi('C',6)],bass:[midi('C',2),midi('C',4)]};
const CLEF={treble:{top:midi('F',5),topLO:['F',5],glyph:'\u{1D11E}',size:48,line:3},bass:{top:midi('A',3),topLO:['A',3],glyph:'\u{1D122}',size:48,line:1}};

// ---------- storage ----------
const KEY='ivory-reader-v1';
let store={notes:{},log:[],pieces:{},pieceStats:{},ear:{}};
try{const raw=localStorage.getItem(KEY);if(raw){const p=JSON.parse(raw);if(p&&p.notes&&p.log)store=Object.assign({pieces:{},pieceStats:{},ear:{}},p);}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}

// ---------- audio ----------
let ctx=null;
function audio(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx;}
function toneAt(m,t,dur,dest){
  const c=audio();
  if(IvoryPiano.noteAt(c,m,t,dur,dest))return;   // sampled grand; the synth below is the fallback while samples load
  const f=440*Math.pow(2,(m-69)/12),g=c.createGain();
  g.connect(dest||c.destination);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.45,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  [[1,'triangle',0.6],[2,'sine',0.25],[3,'sine',0.08]].forEach(([h,type,amp])=>{
    const o=c.createOscillator(),og=c.createGain();o.type=type;o.frequency.value=f*h;og.gain.value=amp;o.connect(og);og.connect(g);o.start(t);o.stop(t+dur+0.05);
  });
}
function play(m,dur){if(!$('sound').checked)return;try{const c=audio();toneAt(m,c.currentTime,dur||1.4);}catch(e){}}
function clickAt(t,accent,dest){
  const c=audio(),o=c.createOscillator(),g=c.createGain();
  o.type='square';o.frequency.value=accent?1400:1000;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(accent?0.5:0.3,t+0.002);g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
  o.connect(g);g.connect(dest||c.destination);o.start(t);o.stop(t+0.06);
}

// ---------- staff drawing (flashcards) ----------
function drawStaff(svg,clefName,note){
  const S=12,top=36,left=16,width=268,c=CLEF[clefName];
  let h='';
  for(let i=0;i<5;i++){const y=top+i*S;h+=`<line class="ln" x1="${left}" y1="${y}" x2="${left+width}" y2="${y}"/>`;}
  h+=`<text class="clef" x="${left+6}" y="${top+c.line*S}" font-size="${c.size}">${c.glyph}</text>`;
  if(note!=null){
    const x=190,y=top+(dia(c.top)-dia(note))*S/2;
    for(let ly=top-S;ly>=y-1;ly-=S)h+=`<line class="ln" x1="${x-15}" y1="${ly}" x2="${x+15}" y2="${ly}"/>`;
    for(let ly=top+5*S;ly<=y+1;ly+=S)h+=`<line class="ln" x1="${x-15}" y1="${ly}" x2="${x+15}" y2="${ly}"/>`;
    const up=y>top+2*S;
    h+=`<ellipse class="note" cx="${x}" cy="${y}" rx="7.2" ry="5" transform="rotate(-20 ${x} ${y})"/>`;
    h+=up?`<line class="stem" x1="${x+6.5}" y1="${y-1}" x2="${x+6.5}" y2="${y-3.3*S}"/>`:`<line class="stem" x1="${x-6.5}" y1="${y+1}" x2="${x-6.5}" y2="${y+3.3*S}"/>`;
  }
  svg.innerHTML=h;
}
// Grand staff for the two-hands-together drill: a treble note and a bass note, played at once.
function drawGrandStaff(svg,tNote,bNote){
  const S=10,left=16,width=268,gap=40,topT=30,topB=topT+4*S+gap;
  let h='';
  [['treble',topT,tNote],['bass',topB,bNote]].forEach(([clefName,top,note])=>{
    const c=CLEF[clefName];
    for(let i=0;i<5;i++){const y=top+i*S;h+=`<line class="ln" x1="${left}" y1="${y}" x2="${left+width}" y2="${y}"/>`;}
    h+=`<text class="clef" x="${left+6}" y="${top+c.line*S}" font-size="${Math.round(c.size*S/12)}">${c.glyph}</text>`;
    const x=190,y=top+(dia(c.top)-dia(note))*S/2;
    for(let ly=top-S;ly>=y-1;ly-=S)h+=`<line class="ln" x1="${x-13}" y1="${ly}" x2="${x+13}" y2="${ly}"/>`;
    for(let ly=top+5*S;ly<=y+1;ly+=S)h+=`<line class="ln" x1="${x-13}" y1="${ly}" x2="${x+13}" y2="${ly}"/>`;
    const up=y>top+2*S;
    h+=`<ellipse class="note" cx="${x}" cy="${y}" rx="6" ry="4.2" transform="rotate(-20 ${x} ${y})"/>`;
    h+=up?`<line class="stem" x1="${x+5.4}" y1="${y-1}" x2="${x+5.4}" y2="${y-2.8*S}"/>`:`<line class="stem" x1="${x-5.4}" y1="${y+1}" x2="${x-5.4}" y2="${y+2.8*S}"/>`;
  });
  svg.innerHTML=h;
}

// ---------- keyboard ----------
function buildKeyboard(el,lo,hi,opts){
  opts=opts||{};el.innerHTML='';
  const whites=[];for(let m=lo;m<=hi;m++)if(!isBlack(m))whites.push(m);
  const avail=el.parentElement.clientWidth||360,coarse=matchMedia('(pointer: coarse)').matches;
  // Touch keys never shrink below a comfortable fingertip width; when the range
  // doesn't fit, the keyboard scrolls horizontally (.kbwrap) instead of squeezing keys.
  const kw=Math.max(coarse?38:22,Math.min(opts.maxKw||(coarse?100:56),Math.floor(avail/whites.length)));
  el.style.setProperty('--kw',kw+'px');el.style.width=(whites.length*kw)+'px';
  whites.forEach(m=>{
    const d=document.createElement('div');d.className='w'+(m===60?' middle':'');d.dataset.m=m;
    if(opts.names!==false)d.textContent=noteName(m);
    if(opts.fingers&&opts.fingers[m])opts.fingers[m].forEach((f,i)=>{d.innerHTML+=`<span class="fg ${f.hand}" style="top:${34+i*28}px">${f.n}</span>`;});
    el.appendChild(d);
  });
  whites.forEach((m,i)=>{
    const nb=m+1;if(nb>hi||!isBlack(nb))return;
    const b=document.createElement('div');b.className='b';b.dataset.m=nb;b.style.left=((i+1)*kw-kw*0.3)+'px';el.appendChild(b);
  });
  el.onpointerdown=e=>{const k=e.target.closest('[data-m]');if(!k)return;e.preventDefault();const m=+k.dataset.m;flash(k,'down',140);play(m);if(opts.onKey)opts.onKey(m,'screen');};
}
const keyEl=(kb,m)=>kb.querySelector(`[data-m="${m}"]`);
function flash(el,cls,ms){if(!el)return;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),ms);}

// ---------- tabs ----------
const tabs=[...document.querySelectorAll('nav [role=tab]')];
let activeTab='read';
function showTab(name){
  activeTab=name;
  tabs.forEach(t=>t.setAttribute('aria-selected',String(t.dataset.tab===name)));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+name));
  // While practicing a song the page holds still: no scroll, no bounce, so a
  // stray touch near an edge never shifts the keyboard out from under a hand.
  document.body.classList.toggle('lock-scroll',name==='practice');
  if(name==='read')layoutRead();if(name==='hand')layoutHand();if(name==='ear')layoutEar();if(name==='practice')layoutPractice();if(name==='progress')renderProgress();
  try{localStorage.setItem(KEY+':tab',name);}catch(e){}
}
tabs.forEach(t=>t.addEventListener('click',()=>showTab(t.dataset.tab)));

// ---------- reading drill ----------
const clefSel=$('clef'),rangeSel=$('range'),namesChk=$('names'),staff=$('staff'),staff2=$('staff2'),fb=$('feedback'),kb=$('kb');
const handsModeSel=$('handsmode'),clefLabel=$('clef-label'),micRow=$('mic-row'),lettersEl=$('letters'),readKeyhint=$('read-keyhint');
let q=null,locked=false,lastNote=null,session={n:0,ok:0,streak:0,times:[]},kbClef=null,advanceTimer=null;
function stat(m,clef){return store.notes[clef+':'+m]||{ok:0,n:0,recent:[]};}
function weight(m,clef){const s=stat(m,clef);const miss=s.recent.filter(x=>!x).length;return 1+miss*3+(s.n===0?1:0);}
function pick(){
  const clefs=clefSel.value==='both'?['treble','bass']:[clefSel.value],cands=[];
  clefs.forEach(c=>POOL[c][rangeSel.value].forEach(m=>{if(!(lastNote&&lastNote.m===m&&lastNote.clef===c))cands.push({m,clef:c,w:weight(m,c)});}));
  let r=Math.random()*cands.reduce((a,c)=>a+c.w,0);
  for(const c of cands){r-=c.w;if(r<=0)return c;}
  return cands[cands.length-1];
}
function drillRange(clef){
  const pool=POOL[clef][rangeSel.value],lo=Math.min(...pool),hi=Math.max(...pool);
  const start=lo-((lo%12)+12)%12;                       // the C at or below the lowest note
  let end=hi+1;while(isBlack(end))end++;                // one white key above the highest
  return [start,end];
}
function layoutRead(){
  if(handsModeSel.value==='2'){
    if(!q2)return;
    const key='both:'+rangeSel.value;
    if(kbClef!==key||!kb.children.length){
      kbClef=key;const rT=drillRange('treble'),rB=drillRange('bass');
      buildKeyboard(kb,rB[0],rT[1],{names:namesChk.checked,onKey:answerKey2});
    }
    return;
  }
  if(!q)return;
  const key=q.clef+':'+rangeSel.value;
  if(kbClef!==key||!kb.children.length){kbClef=key;const r=drillRange(q.clef);buildKeyboard(kb,r[0],r[1],{names:namesChk.checked,onKey:answerKey});}
}
function nextRead(){if(handsModeSel.value==='2')next2();else next();}
function next(){
  clearTimeout(advanceTimer);
  q=pick();lastNote=q;locked=false;q.t=performance.now();
  drawStaff(staff,q.clef,q.m);
  fb.className='feedback';fb.innerHTML=`<span class="hint">${q.clef==='treble'?'Treble clef':'Bass clef'}. Find this note.</span>`;
  layoutRead();
  kb.querySelectorAll('.good,.bad').forEach(k=>k.classList.remove('good','bad'));
  document.querySelectorAll('#letters button').forEach(b=>b.classList.remove('good','bad'));
}
function record(ok){
  const key=q.clef+':'+q.m;const s=store.notes[key]||{ok:0,n:0,recent:[]};
  s.n++;if(ok)s.ok++;s.recent.push(ok?1:0);if(s.recent.length>10)s.recent.shift();store.notes[key]=s;
  const dt=Math.round(performance.now()-q.t);store.log.push({m:q.m,c:q.clef,ok:ok?1:0,ms:dt,at:Date.now()});if(store.log.length>2000)store.log.shift();
  save();
  session.n++;if(ok){session.ok++;session.streak++;session.times.push(dt);}else session.streak=0;
  $('s-count').textContent=session.n;$('s-acc').textContent=Math.round(100*session.ok/session.n)+'%';$('s-streak').textContent=session.streak;
  if(session.times.length){const last=session.times.slice(-10);$('s-time').textContent=(last.reduce((a,b)=>a+b,0)/last.length/1000).toFixed(1)+'s';}
}
function answerKey(m,source){
  if(!q)return;
  if(locked){if(fb.classList.contains('bad'))next();return;}
  finish(m===q.m,m);
}
function answerLetter(letter){if(!q||locked)return;finish(letter===letterOf(q.m),null);}
function finish(ok,pressed){
  locked=true;record(ok);
  const correctEl=keyEl(kb,q.m);
  if(ok){
    if(correctEl)correctEl.classList.add('good');
    fb.className='feedback good';fb.innerHTML=`<span class="big">${noteName(q.m)}</span><span class="hint">Right.</span>`;
    advanceTimer=setTimeout(next,650);
  }else{
    if(pressed!=null)keyEl(kb,pressed)?.classList.add('bad');
    if(correctEl)correctEl.classList.add('good');
    play(q.m,1.4);
    fb.className='feedback bad';fb.innerHTML=`<span class="big">${noteName(q.m)}</span><span class="hint">${pressed!=null?`You played ${noteName(pressed)}. `:''}The correct key is lit green. Any key continues.</span>`;
    advanceTimer=setTimeout(next,2600);
  }
}
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const tag=(e.target.tagName||'').toLowerCase();if(tag==='select'||tag==='input'||tag==='textarea')return;
  if(activeTab==='read'){
    if(handsModeSel.value==='2'){if(locked2&&fb.classList.contains('bad'))next2();return;}
    if(locked){if(q&&fb.classList.contains('bad'))next();return;}
    const L=e.key.toUpperCase();if(LETTERS.includes(L)){answerLetter(L);e.preventDefault();}
  }else if(activeTab==='hand'){if(/^[1-5]$/.test(e.key))fdAnswer(+e.key);}
  else if(activeTab==='ear'){
    if(e.key===' '){e.preventDefault();eq?earPlay():earNext();return;}
    if(e.key==='Enter'){e.preventDefault();earNext();return;}
    if(earChoices.hidden)return;
    if(earDrill()==='hl'&&(e.key==='ArrowUp'||e.key==='ArrowDown')){
      const v=e.key==='ArrowUp'?'up':'down',b=earChoices.querySelector(`[data-v="${v}"]`);
      if(b){e.preventDefault();earChoose(v,b);}return;
    }
    if(/^[1-9]$/.test(e.key)){const b=earChoices.children[+e.key-1];if(b){e.preventDefault();earChoose(b.dataset.v,b);}}
  }
  else if(activeTab==='practice'){if(e.key===' '){e.preventDefault();if(transport.mode)stopAll();else startWait();}}
});
[clefSel,rangeSel].forEach(s=>s.addEventListener('change',()=>{kbClef=null;nextRead();}));
namesChk.addEventListener('change',()=>{kbClef=null;layoutRead();});

// ---------- reading drill: both hands together (a treble note + a bass note, played at once) ----------
let q2=null,locked2=false,lastNote2=null,hits2=new Set();
function pickSide(clef){
  const cands=POOL[clef][rangeSel.value].map(m=>({m,w:weight(m,clef)}));
  let r=Math.random()*cands.reduce((a,c)=>a+c.w,0);
  for(const c of cands){r-=c.w;if(r<=0)return c.m;}
  return cands[cands.length-1].m;
}
function pick2(){
  let t,b;
  do{t=pickSide('treble');b=pickSide('bass');}while(t===b||(lastNote2&&t===lastNote2.t&&b===lastNote2.b));
  return {t,b};
}
function next2(){
  clearTimeout(advanceTimer);
  const p=pick2();q2={t:p.t,b:p.b,t0:performance.now()};lastNote2=p;locked2=false;hits2=new Set();
  drawGrandStaff(staff2,q2.t,q2.b);
  fb.className='feedback';fb.innerHTML='<span class="hint">Grand staff. Play both notes together, either hand first.</span>';
  layoutRead();
  kb.querySelectorAll('.good,.bad').forEach(k=>k.classList.remove('good','bad'));
}
function record2(ok){
  [['treble',q2.t],['bass',q2.b]].forEach(([clef,m])=>{
    const key=clef+':'+m,s=store.notes[key]||{ok:0,n:0,recent:[]};
    s.n++;if(ok)s.ok++;s.recent.push(ok?1:0);if(s.recent.length>10)s.recent.shift();store.notes[key]=s;
  });
  const dt=Math.round(performance.now()-q2.t0);
  store.log.push({m:q2.t,c:'treble',ok:ok?1:0,ms:dt,at:Date.now()});
  store.log.push({m:q2.b,c:'bass',ok:ok?1:0,ms:dt,at:Date.now()});
  while(store.log.length>2000)store.log.shift();
  save();
  session.n++;if(ok){session.ok++;session.streak++;session.times.push(dt);}else session.streak=0;
  $('s-count').textContent=session.n;$('s-acc').textContent=Math.round(100*session.ok/session.n)+'%';$('s-streak').textContent=session.streak;
  if(session.times.length){const last=session.times.slice(-10);$('s-time').textContent=(last.reduce((a,b)=>a+b,0)/last.length/1000).toFixed(1)+'s';}
}
function answerKey2(m,source){
  if(!q2)return;
  if(locked2){if(fb.classList.contains('bad'))next2();return;}
  if(m===q2.t||m===q2.b){
    hits2.add(m);
    const el=keyEl(kb,m);if(el)el.classList.add('good');
    if(hits2.size===2)finish2(true,null);
  }else finish2(false,m);
}
function finish2(ok,pressed){
  locked2=true;record2(ok);
  const tEl=keyEl(kb,q2.t),bEl=keyEl(kb,q2.b),pair=`${noteName(q2.t)} + ${noteName(q2.b)}`;
  if(ok){
    tEl?.classList.add('good');bEl?.classList.add('good');
    fb.className='feedback good';fb.innerHTML=`<span class="big">${pair}</span><span class="hint">Right.</span>`;
    advanceTimer=setTimeout(next2,700);
  }else{
    if(pressed!=null)keyEl(kb,pressed)?.classList.add('bad');
    tEl?.classList.add('good');bEl?.classList.add('good');
    play(q2.t,1.2);play(q2.b,1.2);
    fb.className='feedback bad';fb.innerHTML=`<span class="big">${pair}</span><span class="hint">${pressed!=null?`You played ${noteName(pressed)}. `:''}The correct keys are lit green. Any key continues.</span>`;
    advanceTimer=setTimeout(next2,2600);
  }
}
function setHandsMode(){
  const together=handsModeSel.value==='2';
  clefLabel.hidden=together;micRow.hidden=together;lettersEl.hidden=together;
  staff.classList.toggle('staff-off',together);staff2.classList.toggle('staff-off',!together);
  readKeyhint.innerHTML=together
    ?'Play the right-hand note and the left-hand note, in either order. Any key moves on after a mistake.'
    :'Computer keys <kbd>A</kbd> to <kbd>G</kbd> answer by letter. Any key moves on after a mistake. <b>Listen with mic</b> answers by playing the note on a real piano, one note at a time, in a quiet room.';
  if(together&&micStream)stopMic();
  kbClef=null;nextRead();
}
handsModeSel.addEventListener('change',setHandsMode);

// ---------- hand position ----------
const POS={
  c:{title:'C position',desc:'The first position every method book starts with. Right thumb on middle C, left little finger on the C an octave below. Each finger owns one key and does not move.',
     L:[[midi('C',3),5],[midi('D',3),4],[midi('E',3),3],[midi('F',3),2],[midi('G',3),1]],R:[[midi('C',4),1],[midi('D',4),2],[midi('E',4),3],[midi('F',4),4],[midi('G',4),5]]},
  mc:{title:'Middle C position',desc:'Both thumbs share middle C. The hands sit side by side, which is how many beginner duets and the first two-hand pieces are written.',
     L:[[midi('F',3),5],[midi('G',3),4],[midi('A',3),3],[midi('B',3),2],[midi('C',4),1]],R:[[midi('C',4),1],[midi('D',4),2],[midi('E',4),3],[midi('F',4),4],[midi('G',4),5]]},
  g:{title:'G position',desc:'Same hand shape as C position, moved up to G. Right thumb on the G above middle C, left little finger on the G below it. Pieces in this position often add an F sharp.',
     L:[[midi('G',2),5],[midi('A',2),4],[midi('B',2),3],[midi('C',3),2],[midi('D',3),1]],R:[[midi('G',4),1],[midi('A',4),2],[midi('B',4),3],[midi('C',5),4],[midi('D',5),5]]}
};
const posSel=$('pos'),kbHand=$('kb-hand');
function layoutHand(){
  const p=POS[posSel.value];
  $('pos-title').textContent=p.title;$('pos-desc').textContent=p.desc;
  const fingers={};p.L.forEach(([m,n])=>(fingers[m]=fingers[m]||[]).push({hand:'L',n}));p.R.forEach(([m,n])=>(fingers[m]=fingers[m]||[]).push({hand:'R',n}));
  buildKeyboard(kbHand,posSel.value==='g'?midi('G',2):midi('C',3),posSel.value==='g'?midi('E',5):midi('C',5),{names:true,fingers});
  $('fd-pos').textContent=p.title;fdNext();
}
posSel.addEventListener('change',layoutHand);
const staffFd=$('staff-fd'),fdFb=$('fd-feedback'),fingerBtns=[...document.querySelectorAll('#fingers button')];
let fq=null,fdLocked=false,fdTimer=null;
function fdNext(){
  clearTimeout(fdTimer);
  const p=POS[posSel.value],hand=Math.random()<0.5?'L':'R',list=p[hand];
  let pair=list[Math.floor(Math.random()*list.length)];
  if(fq&&fq.hand===hand&&fq.m===pair[0])pair=list[(list.indexOf(pair)+1)%list.length];
  fq={hand,m:pair[0],f:pair[1]};fdLocked=false;
  $('fd-hand').textContent=hand==='L'?'left hand':'right hand';
  drawStaff(staffFd,hand==='L'?'bass':'treble',fq.m);
  fingerBtns.forEach(b=>b.classList.remove('good','bad'));
  fdFb.className='feedback';fdFb.innerHTML='<span class="hint">Keys 1 to 5 on your computer work too.</span>';
}
function fdAnswer(n){
  if(!fq||fdLocked)return;fdLocked=true;
  const ok=n===fq.f,btn=fingerBtns[n-1];play(fq.m);
  if(ok){btn.classList.add('good');fdFb.className='feedback good';fdFb.innerHTML=`<span class="big">${noteName(fq.m)}, finger ${fq.f}</span>`;fdTimer=setTimeout(fdNext,700);}
  else{btn.classList.add('bad');fingerBtns[fq.f-1].classList.add('good');fdFb.className='feedback bad';fdFb.innerHTML=`<span class="big">${noteName(fq.m)} is finger ${fq.f}</span><span class="hint">${fq.hand==='L'?'Left hand: little finger is 5, thumb is 1.':'Right hand: thumb is 1, little finger is 5.'}</span>`;fdTimer=setTimeout(fdNext,2200);}
}

// ---------- ear training ----------
// Hearing pitch is comparison: the drills always give the ear a bearing (a
// reference C, or the first of two notes) and ask how far the next one sits
// from it. Pools, weighting and the interval table are in src/ear.js.
const {INTERVALS,INT_SETS,RANGES:EAR_RANGES,GAP_SETS,notePool,intervalsIn,
  weightOf:earWeightOf,pickWeighted,pickRoot,gapBucket}=IvoryEar;
const earDrillSel=$('ear-drill'),earRangeSel=$('ear-range'),earKeysSel=$('ear-keys');
const earSetSel=$('ear-set'),earDirSel=$('ear-dir'),earGapSel=$('ear-gap');
const earRefChk=$('ear-ref'),earNamesChk=$('ear-names');
const kbEar=$('kb-ear'),earFb=$('ear-feedback'),earChoices=$('ear-choices'),earStatusEl=$('ear-status'),earKbWrap=$('ear-kbwrap');
let eq=null,earLocked=false,earTimer=null,earSayTimer=null,earKbKey=null,earLastItem=null;
const earSession={n:0,ok:0,streak:0};
const earDrill=()=>earDrillSel.value;
const earSay=html=>{earStatusEl.innerHTML=html;};
function earStat(key){return store.ear[key]||{ok:0,n:0,recent:[]};}
function earPick(items,keyOf){return pickWeighted(items,it=>earWeightOf(earStat(keyOf(it))));}
function earRecord(key,ok){
  const s=store.ear[key]||{ok:0,n:0,recent:[]};
  s.n++;if(ok)s.ok++;s.recent.push(ok?1:0);if(s.recent.length>10)s.recent.shift();
  store.ear[key]=s;save();
  earSession.n++;if(ok){earSession.ok++;earSession.streak++;}else earSession.streak=0;
  $('e-count').textContent=earSession.n;
  $('e-acc').textContent=Math.round(100*earSession.ok/earSession.n)+'%';
  $('e-streak').textContent=earSession.streak;
}

// A question carries the notes to play, the key its score is filed under, and
// whatever the answer needs to be checked against.
function earNewQuestion(){
  const d=earDrill();
  if(d==='note'){
    let pool=notePool(earRangeSel.value,earKeysSel.value);
    if(pool.length>1&&earLastItem!=null)pool=pool.filter(m=>m!==earLastItem);
    const m=earPick(pool,x=>'note:'+x);
    earLastItem=m;
    return {drill:'note',key:'note:'+m,m,ref:EAR_RANGES[earRangeSel.value].lo};
  }
  if(d==='interval'){
    let set=INT_SETS[earSetSel.value];
    if(set.length>1&&earLastItem!=null)set=set.filter(s=>s!==earLastItem);
    const s=earPick(set,x=>'int:'+x);
    earLastItem=s;
    const dir=earDirSel.value==='mixed'?['up','down','harmonic'][Math.floor(Math.random()*3)]:earDirSel.value;
    const a=pickRoot(s,dir);
    return {drill:'interval',key:'int:'+s,s,dir,a,b:dir==='down'?a-s:a+s};
  }
  const g=earPick(GAP_SETS[earGapSel.value],x=>'hl:'+gapBucket(x));
  const up=Math.random()<0.5,a=pickRoot(g,up?'up':'down');
  return {drill:'hl',key:'hl:'+gapBucket(g),g,up,a,b:up?a+g:a-g};
}
// What to play, as offsets in seconds from the start of the question.
function earSeq(){
  if(!eq)return [];
  if(eq.drill==='note'){
    const seq=[];let at=0;
    if(earRefChk.checked){seq.push({m:eq.ref,at:0,dur:1});at=0.95;}
    seq.push({m:eq.m,at,dur:1.4});
    return seq;
  }
  if(eq.dir==='harmonic')return [{m:eq.a,at:0,dur:1.7},{m:eq.b,at:0,dur:1.7}];
  return [{m:eq.a,at:0,dur:1.1},{m:eq.b,at:0.85,dur:1.4}];
}
function earPrompt(){
  return eq==null?'Press <b>New question</b> to hear one.'
    :eq.drill==='note'?'Tap the key you heard.'
    :eq.drill==='interval'?'How far apart were the two notes?'
    :'Was the second note higher or lower?';
}
function earPlay(){
  if(!eq)return;
  if(!$('sound').checked){$('ear-sound-warn').hidden=false;earSay('Nothing played: <b>App sound</b> is off.');return;}
  $('ear-sound-warn').hidden=true;
  const seq=earSeq();let end=0;
  try{
    const c=audio(),t0=c.currentTime+0.08;
    seq.forEach(s=>{toneAt(s.m,t0+s.at,s.dur);end=Math.max(end,s.at+s.dur);});
  }catch(e){earSay('This browser is holding sound back. Tap the page once, then press <b>Replay</b>.');return;}
  clearTimeout(earSayTimer);
  earSay('Playing…');
  earSayTimer=setTimeout(()=>earSay(earLocked?'Next question in a moment.':earPrompt()),Math.round(end*1000));
}
function earNext(){
  clearTimeout(earTimer);clearTimeout(earSayTimer);
  eq=earNewQuestion();earLocked=false;
  earFb.className='feedback';earFb.innerHTML='<span class="hint">'+earPrompt()+'</span>';
  kbEar.querySelectorAll('.good,.bad').forEach(k=>k.classList.remove('good','bad'));
  [...earChoices.children].forEach(b=>b.classList.remove('good','bad'));
  layoutEar();
  earPlay();
}
// How the answer reads once it is revealed: the name, and where it sat.
function earFromRef(ref,m){
  const d=m-ref,oct=Math.floor(d/12),rest=d%12;
  const octs=n=>n===1?'an octave':n+' octaves';
  if(d===0)return 'the reference note itself';
  if(rest===0)return octs(oct)+' above the reference C';
  return 'a '+INTERVALS[rest].name.toLowerCase()+(oct?' plus '+octs(oct):'')+' above the reference C';
}
function earReveal(){
  if(eq.drill==='note')return {big:noteName(eq.m),detail:earRefChk.checked?earFromRef(eq.ref,eq.m)+'.':''};
  if(eq.drill==='interval')return {big:INTERVALS[eq.s].name,detail:`${noteName(eq.a)} to ${noteName(eq.b)}.`};
  return {big:eq.up?'Higher':'Lower',detail:`${noteName(eq.a)} then ${noteName(eq.b)}, ${eq.g} semitone${eq.g===1?'':'s'} apart.`};
}
function earFinish(ok,pressed){
  earLocked=true;clearTimeout(earSayTimer);
  earRecord(eq.key,ok);
  const r=earReveal();
  if(ok){
    earFb.className='feedback good';
    earFb.innerHTML=`<span class="big">${r.big}</span><span class="hint">Right. ${r.detail}</span>`;
    earSay('Next question in a moment.');
    earTimer=setTimeout(earNext,1100);
  }else{
    earFb.className='feedback bad';
    const you=pressed!=null?`You played ${noteName(pressed)}. `:'';
    earFb.innerHTML=`<span class="big">${r.big}</span><span class="hint">${you}${r.detail} Playing it again; any answer moves on.</span>`;
    earPlay();
    earTimer=setTimeout(earNext,3600);
  }
}
function earAnswerNote(m){
  if(!eq||eq.drill!=='note')return;
  if(earLocked){if(earFb.classList.contains('bad'))earNext();return;}
  const ok=m===eq.m;
  keyEl(kbEar,eq.m)?.classList.add('good');
  if(!ok)keyEl(kbEar,m)?.classList.add('bad');
  earFinish(ok,ok?null:m);
}
function earChoose(v,btn){
  if(!eq||eq.drill==='note')return;
  if(earLocked){if(earFb.classList.contains('bad'))earNext();return;}
  const right=eq.drill==='interval'?String(eq.s):(eq.up?'up':'down'),ok=v===right;
  btn.classList.add(ok?'good':'bad');
  if(!ok)earChoices.querySelector(`[data-v="${right}"]`)?.classList.add('good');
  earFinish(ok,null);
}
function earRenderChoices(){
  const d=earDrill(),sig=d+':'+earSetSel.value;
  if(earChoices.dataset.sig===sig&&earChoices.children.length)return;
  earChoices.dataset.sig=sig;earChoices.innerHTML='';earChoices.classList.toggle('two-up',d==='hl');
  const items=d==='interval'
    ?intervalsIn(earSetSel.value).map(i=>({v:String(i.s),ab:i.ab,name:i.name}))
    :[{v:'up',ab:'Higher',name:'the second was higher'},{v:'down',ab:'Lower',name:'the second was lower'}];
  items.forEach(it=>{
    const b=document.createElement('button');b.type='button';b.dataset.v=it.v;
    b.innerHTML=`<b>${it.ab}</b><span>${it.name}</span>`;
    b.addEventListener('click',()=>earChoose(it.v,b));
    earChoices.appendChild(b);
  });
}
// The answer keyboard starts on the C at or below the range and ends on a white key.
function earKbRange(){
  const r=EAR_RANGES[earRangeSel.value];
  let hi=r.hi;while(isBlack(hi))hi++;
  return [r.lo-((r.lo%12)+12)%12,hi];
}
function layoutEar(){
  const d=earDrill();
  $('ear-range-label').hidden=$('ear-keys-label').hidden=$('ear-ref-label').hidden=$('ear-names-label').hidden=d!=='note';
  $('ear-set-label').hidden=$('ear-dir-label').hidden=d!=='interval';
  $('ear-gap-label').hidden=d!=='hl';
  earChoices.hidden=d==='note';earKbWrap.hidden=d!=='note';
  if(d==='note'){
    const key=earRangeSel.value+':'+earKeysSel.value+':'+earNamesChk.checked;
    if(earKbKey!==key||!kbEar.children.length){
      earKbKey=key;const [lo,hi]=earKbRange();
      buildKeyboard(kbEar,lo,hi,{names:earNamesChk.checked,onKey:earAnswerNote});
    }
  }else earRenderChoices();
  $('ear-sound-warn').hidden=$('sound').checked;
}
$('ear-next').addEventListener('click',earNext);
$('ear-replay').addEventListener('click',()=>{if(eq)earPlay();else earNext();});
[earDrillSel,earRangeSel,earKeysSel,earSetSel,earDirSel,earGapSel].forEach(sel=>sel.addEventListener('change',()=>{
  earKbKey=null;earLastItem=null;
  if(eq)earNext();else layoutEar();       // no question yet: just re-dress the controls
}));
earNamesChk.addEventListener('change',()=>{earKbKey=null;layoutEar();});
$('sound').addEventListener('change',()=>{if(activeTab==='ear')$('ear-sound-warn').hidden=$('sound').checked;});

// ---------- notation parser: src/parse.js; play-along scoring: src/playalong.js ----------
const {parsePiece,SHARPS,FLATS,PARTS}=IvoryParse;
const {Scorer}=IvoryPlayAlong;
// Piano samples: embedded base64 in the claude.ai copy, fetched from ./audio/ on the site.
function sampleSource(name){
  if(window.IVORY_SAMPLES&&window.IVORY_SAMPLES[name]){const bin=atob(window.IVORY_SAMPLES[name]);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return Promise.resolve(u.buffer);}
  return fetch('./audio/'+name+'.mp3').then(r=>{if(!r.ok)throw new Error(r.status);return r.arrayBuffer();});
}
const PLAY_TOL=0.34; // beats either side of a note that still count as on time

// ---------- score renderer ----------
function renderScore(svg,piece,width){
  const S=10,LH=S*4,GAP=46,LEFT=34,RIGHT=8,parts=PARTS.filter(p=>piece.parts[p]),hands=['RH','LH'].filter(h=>piece.parts[h]),grand=hands.length===2;
  const sysH=(grand?LH*2+GAP:LH)+58;
  const perSys=Math.max(1,Math.min(4,Math.floor((width-LEFT-RIGHT)/230)));
  const nSys=Math.ceil(piece.nBars/perSys);
  const H=nSys*sysH+10;
  let h='';const pos={};// id -> {x,y,part}
  const barPos=[];// bar index -> {x,w,top,bot}: the track the playhead runs along
  const clefFor=p=>piece.handOf(p)==='RH'?'treble':'bass';
  function staffTop(sys,part){return 30+sys*sysH+(piece.handOf(part)==='LH'&&grand?LH+GAP:0);}
  function yOf(part,letter,oct,top){const c=CLEF[clefFor(part)];return top+(diaLO(c.topLO[0],c.topLO[1])-diaLO(letter,oct))*S/2;}
  for(let sys=0;sys<nSys;sys++){
    const m0=sys*perSys,m1=Math.min(piece.nBars,m0+perSys);
    const first=sys===0;
    const headW=38+Math.abs(piece.key.count)*7+(first?22:0);
    const x0=LEFT,x1=width-RIGHT,mw=(x1-x0-headW)/(m1-m0);
    hands.forEach(part=>{
      const top=staffTop(sys,part),c=CLEF[clefFor(part)];
      for(let i=0;i<5;i++)h+=`<line class="ln" x1="${x0}" y1="${top+i*S}" x2="${x1}" y2="${top+i*S}"/>`;
      h+=`<text class="clef" x="${x0+3}" y="${top+c.line*S}" font-size="${S*4}">${c.glyph}</text>`;
      // key signature
      const k=piece.key.count;const order=k>0?SHARPS:FLATS;const glyph=k>0?'♯':'♭';
      const sharpPos={treble:[['F',5],['C',5],['G',5],['D',5],['A',4],['E',5],['B',4]],bass:[['F',3],['C',3],['G',3],['D',3],['A',2],['E',3],['B',2]]};
      const flatPos={treble:[['B',4],['E',5],['A',4],['D',5],['G',4],['C',5],['F',4]],bass:[['B',2],['E',3],['A',2],['D',3],['G',2],['C',3],['F',2]]};
      for(let i=0;i<Math.abs(k);i++){const lo=(k>0?sharpPos:flatPos)[clefFor(part)][i];h+=`<text class="glyph" x="${x0+34+i*7}" y="${yOf(part,lo[0],lo[1],top)+4}" font-size="${S*1.7}">${glyph}</text>`;}
      if(first){const tx=x0+38+Math.abs(k)*7;h+=`<text class="ts" x="${tx}" y="${top+S*2-1}">${piece.time[0]}</text><text class="ts" x="${tx}" y="${top+S*4-1}">${piece.time[1]}</text>`;}
    });
    const topA=staffTop(sys,hands[0]),botB=staffTop(sys,hands[hands.length-1])+LH;
    h+=`<text class="txt" x="${x0}" y="${topA-12}">${m0+1}</text>`;
    for(let mi=m0;mi<m1;mi++){
      const mx=x0+headW+(mi-m0)*mw;
      const pad=14,inner=mw-pad-10;
      barPos[mi]={x:mx+pad,w:inner,top:topA,bot:botB};
      const bx=mx+mw;h+=`<line class="ln" x1="${bx}" y1="${topA}" x2="${bx}" y2="${botB}"/>`;
      if(mi===piece.nBars-1)h+=`<line class="ln" x1="${bx-3}" y1="${topA}" x2="${bx-3}" y2="${botB}" style="stroke-width:3"/>`;
      parts.forEach(part=>{
        const top=staffTop(sys,part),bar=piece.parts[part][mi];
        const voice2=part.endsWith('2'),twoVoices=voice2||!!piece.parts[part+'2'];let tupX=null;
        bar.notes.forEach((n,ni)=>{
          const x=mx+pad+(n.start/piece.beatsPerBar)*inner;
          const id=`${part}-${mi}-${ni}`;
          let g=`<g class="ev" data-id="${id}">`;
          if(n.rest){
            const midY=top+2*S;
            if(n.kind==='w')g+=`<rect class="rest" x="${x-5}" y="${top+S}" width="11" height="4.5"/>`;
            else if(n.kind==='h')g+=`<rect class="rest" x="${x-5}" y="${midY-4.5}" width="11" height="4.5"/>`;
            else{const gl=n.kind==='q'?'\u{1D13D}':n.kind==='e'?'\u{1D13E}':'\u{1D13F}';g+=`<text class="glyph" x="${x-5}" y="${midY+2}" font-size="${S*3}">${gl}</text>`;}
            if(n.dot)g+=`<circle class="rest" cx="${x+10}" cy="${midY-S/2}" r="1.6"/>`;
            pos[id]={x,y:midY,part};
          }else{
            const ys=n.pitches.map(p=>yOf(part,p.letter,p.oct,top));
            const yTop=Math.min(...ys),yBot=Math.max(...ys);
            // ledger lines
            n.pitches.forEach((p,i)=>{const y=ys[i];for(let ly=top-S;ly>=y-1;ly-=S)g+=`<line class="ln" x1="${x-11}" y1="${ly}" x2="${x+11}" y2="${ly}"/>`;for(let ly=top+5*S;ly<=y+1;ly+=S)g+=`<line class="ln" x1="${x-11}" y1="${ly}" x2="${x+11}" y2="${ly}"/>`;});
            // with two voices on a staff, voice 1 stems up and voice 2 stems down
            const up=twoVoices?!voice2:(yTop+yBot)/2>top+2*S;
            n.pitches.forEach((p,i)=>{
              const y=ys[i],hollow=n.kind==='w'||n.kind==='h';
              if(p.show)g+=`<text class="glyph" x="${x-15}" y="${y+4}" font-size="${S*1.7}">${p.show}</text>`;
              g+=`<ellipse class="note${hollow?' hollow':''}" cx="${x}" cy="${y}" rx="6" ry="4.2" transform="rotate(-20 ${x} ${y})"/>`;
              if(n.dot)g+=`<circle class="note" cx="${x+9.5}" cy="${Math.round((y-top)/(S/2))%2===0?y-S/2:y}" r="1.6"/>`;
            });
            if(n.kind!=='w'){
              const sx=up?x+5.3:x-5.3,sy1=up?yBot:yTop,sy2=up?yTop-3.2*S:yBot+3.2*S;
              g+=`<line class="stem" x1="${sx}" y1="${sy1}" x2="${sx}" y2="${sy2}"/>`;
              const flags=n.kind==='e'?1:n.kind==='s'?2:0;
              for(let f=0;f<flags;f++){const fy=sy2+(up?f*7:-f*7);g+=up?`<path class="flag" d="M${sx} ${fy} c 8 4, 9 10, 6 18 c 3 -7, 0 -11, -6 -14 z"/>`:`<path class="flag" d="M${sx} ${fy} c 8 -4, 9 -10, 6 -18 c 3 7, 0 11, -6 14 z"/>`;}
            }
            pos[id]={x,y:up?yBot:yTop,part,up,ys};
            if(n.tie){const nx=x+ (ni+1<bar.notes.length?(bar.notes[ni+1].start-n.start)/piece.beatsPerBar*inner: mw-pad-(n.start/piece.beatsPerBar)*inner+14);const ty=up?yBot+6:yTop-6;const bend=up?8:-8;g+=`<path class="tie" d="M${x+4} ${ty} q ${(nx-x-8)/2} ${bend}, ${nx-x-8} 0"/>`;}
          }
          if(n.tuplet){
            if(n.tuplet.first)tupX=x;
            if(n.tuplet.last&&tupX!=null){const ty=voice2?top+5*S+20:top-16,xm=(tupX+x)/2;g+=`<line class="ln" x1="${tupX-4}" y1="${ty}" x2="${xm-6}" y2="${ty}"/><line class="ln" x1="${xm+6}" y1="${ty}" x2="${x+8}" y2="${ty}"/><text class="txt" x="${xm}" y="${ty+4}" text-anchor="middle" font-style="italic">${n.tuplet.n}</text>`;tupX=null;}
          }
          g+='</g>';h+=g;
        });
      });
    }
  }
  h+=`<line class="playhead" x1="0" y1="0" x2="0" y2="0" visibility="hidden"/>`;
  svg.setAttribute('viewBox',`0 0 ${width} ${H}`);svg.style.height=H+'px';svg.innerHTML=h;
  return {pos,barPos};
}

// ---------- transport: listen mode and wait mode ----------
const transport={mode:null,idx:-1,t0:0,raf:0,mist:0,need:new Set(),got:new Set(),bus:null};
const handsSel=$('hands'),showKeys=$('showkeys'),showLine=$('showline');
// ---------- playhead: a line that rides the beat across the score ----------
function hidePlayhead(){if(playheadEl)playheadEl.setAttribute('visibility','hidden');}
// beat is in piece beats and may be negative during the count-in, where the line parks on bar 1.
function movePlayhead(beat){
  if(!playheadEl)return;
  if(!showLine.checked){hidePlayhead();return;}
  const bpb=piece.beatsPerBar,b=Math.max(0,Math.min(beat,piece.totalBeats));
  const mi=Math.min(barPos.length-1,Math.floor(b/bpb)),g=barPos[mi];
  if(!g){hidePlayhead();return;}
  const x=g.x+Math.max(0,Math.min(1,(b-mi*bpb)/bpb))*g.w;
  playheadEl.setAttribute('x1',x);playheadEl.setAttribute('x2',x);
  playheadEl.setAttribute('y1',g.top-6);playheadEl.setAttribute('y2',g.bot+6);
  playheadEl.setAttribute('visibility','visible');
}
showLine.addEventListener('change',()=>{if(!showLine.checked)hidePlayhead();});
function wanted(part){const h=handsSel.value;return h==='both'||h===piece.handOf(part);}
function activeOnsets(){return piece.onsets.map((o,i)=>({o,i})).filter(x=>x.o.items.some(it=>wanted(it.part)&&!it.n.rest&&!it.n.tiedFrom));}
function highlight(idx){
  scoreSvg.querySelectorAll('g.cur').forEach(g=>g.classList.remove('cur'));
  if(idx<0||!piece.onsets[idx])return;
  const o=piece.onsets[idx];let first=null;
  o.items.forEach(it=>{if(!wanted(it.part))return;const g=scoreSvg.querySelector(`g[data-id="${it.part}-${it.mi}-${it.ni}"]`);if(g){g.classList.add('cur');first=first||g;}});
  if(first){const r=first.getBoundingClientRect(),b=scoreBox.getBoundingClientRect();if(r.top<b.top||r.bottom>b.bottom)scoreBox.scrollTop+=r.top-b.top-40;}
  const mi=Math.floor(o.beat/piece.beatsPerBar);$('p-where').textContent=`Bar ${mi+1} of ${piece.nBars}`;
}
function setNow(text,cls){const el=$('p-now');el.textContent=text;el.className='now '+(cls||'');}
function resetPractice(){transport.mode=null;transport.idx=-1;transport.mist=0;highlight(-1);hidePlayhead();setNow('');$('p-where').textContent='';$('p-mist').textContent='';kbP.querySelectorAll('.want,.good,.bad').forEach(k=>k.classList.remove('want','good','bad'));$('btn-listen').textContent='Listen';$('btn-wait').textContent='Wait mode';$('btn-play').textContent='Play along';updateMicChordHint();}
function stopAll(){
  cancelAnimationFrame(transport.raf);

  const was=transport.mode;resetPractice();

// Schedules every note of the parts that pass pred, tied notes joined.
function playParts(pred,t0,spb,bus){
  PARTS.forEach(part=>{const bars=piece.parts[part];if(!bars||!pred(part))return;
    const flat=[];bars.forEach((bar,mi)=>bar.notes.forEach(n=>flat.push({n,on:mi*piece.beatsPerBar+n.start})));
    flat.forEach((x,i)=>{if(x.n.rest||x.n.tiedFrom)return;let d=x.n.dur;let j=i;while(flat[j].n.tie&&flat[j+1]&&flat[j+1].n.tiedFrom){d+=flat[j+1].n.dur;j++;}
      x.n.pitches.forEach(p=>toneAt(p.m,t0+x.on*spb,Math.max(0.25,d*spb*0.95),bus));});
  });
}
function startListen(){
  stopAll();stopMet();
  const c=audio(),bus=c.createGain();bus.connect(c.destination);transport.bus=bus;
  const bpm=met.bpm,spb=60/bpm,ci=$('countin').checked?piece.beatsPerBar:0;
  const t0=c.currentTime+0.1+ci*spb;transport.t0=t0;transport.mode='listen';
  for(let b=0;b<ci;b++)clickAt(c.currentTime+0.1+b*spb,b===0,bus);
  playParts(wanted,t0,spb,bus);
  $('btn-listen').textContent='Stop';setNow('Listening');
  const acts=activeOnsets();let k=0;
  const tick=()=>{
    const beat=(c.currentTime-t0)/spb;
    movePlayhead(beat);
    if(beat<0){setNow(`Count-in ${Math.ceil(-beat)}`);}
    else{while(k<acts.length-1&&acts[k+1].o.beat<=beat)k++;if(acts[k]&&transport.idx!==acts[k].i){transport.idx=acts[k].i;highlight(transport.idx);setNow('Listening');}}
    if(beat>piece.totalBeats+1){stopAll();setNow('Done');return;}
    transport.raf=requestAnimationFrame(tick);
  };
  transport.raf=requestAnimationFrame(tick);
}
// ---------- play along: click track at the metronome tempo, you play, the app scores ----------
function lightWanted(next){

function playStatus(sc){const s=sc.summary();$('p-mist').textContent=`${s.hit} on time · ${s.missed} missed · ${s.wrong} wrong`;}
function finishPlay(){
  const s=transport.scorer.summary();

function startPlayAlong(){
  stopAll();stopMet();
  const c=audio(),bus=c.createGain();bus.connect(c.destination);transport.bus=bus;
  const bpm=met.bpm,spb=60/bpm,bpb=piece.beatsPerBar,ci=$('countin').checked?bpb:0;
  const t0=c.currentTime+0.1+ci*spb;transport.t0=t0;transport.spb=spb;transport.mode='play';
  for(let b=-ci;b<piece.totalBeats;b++)clickAt(t0+b*spb,((b%bpb)+bpb)%bpb===0,bus);
  if(handsSel.value!=='both')playParts(p=>!wanted(p),t0,spb,bus);   // the other hand as backing
  const acts=activeOnsets(),idxOfBeat=new Map(acts.map(a=>[a.o.beat,a.i]));
  transport.scorer=new Scorer(acts.map(a=>{const ps=new Set();a.o.items.forEach(it=>{if(wanted(it.part)&&!it.n.rest&&!it.n.tiedFrom)it.n.pitches.forEach(p=>ps.add(p.m));});return {beat:a.o.beat,pitches:[...ps]};}),{tol:PLAY_TOL});
  $('btn-play').textContent='Stop';
  const tick=()=>{
    const beat=(c.currentTime-t0)/spb,sc=transport.scorer;
    movePlayhead(beat);
    sc.update(beat);
    const next=sc.next();
    if(next){const i=idxOfBeat.get(next.beat);if(i!==undefined&&transport.idx!==i){transport.idx=i;highlight(i);lightWanted(next);}}
    if(beat<0)setNow(`Count-in ${Math.ceil(-beat)}`);
    playStatus(sc);
    if(sc.done()||beat>piece.totalBeats+1){finishPlay();return;}
    transport.raf=requestAnimationFrame(tick);
  };

function startWait(){

function waitAdvance(){

    const st=store.pieceStats[pieceId]||{runs:0,last:0,at:0};st.runs++;st.last=transport.mist;st.at=Date.now();store.pieceStats[pieceId]=st;save();
    const m=transport.mist;stopAll();setNow(m===0?'Finished, no wrong keys':`Finished, ${m} wrong key${m===1?'':'s'}`,m===0?'good':'');return;
  }

  transport.need=new Set();a.o.items.forEach(it=>{if(wanted(it.part)&&!it.n.rest&&!it.n.tiedFrom)it.n.pitches.forEach(p=>transport.need.add(p.m));});

function practiceKey(m,source){

// ---------- mic pitch detection (Read flashcards, and single-note steps in Practice) ----------
// One autocorrelation pitch detector, shared by both tabs' mic buttons (same class,
// so either one connects/disconnects the one mic stream and both stay in sync).
const micPills=()=>document.querySelectorAll('.mic-pill'),micBtns=()=>document.querySelectorAll('.mic-btn');
let micStream=null,micAnalyser=null,micBuf=null,micLoopId=null;
let micArmed=true,micStableNote=null,micStableCount=0;
const MIC_SILENCE_RMS=0.015,MIC_MIN_CONF=0.85,MIC_STABLE_FRAMES=3,MIC_MIN_HZ=55,MIC_MAX_HZ=1050;
function micStatus(text,cls){micPills().forEach(el=>{el.textContent=text;el.className='pill mic-pill '+(cls||'');});}
function freqToMidi(f){return Math.round(69+12*Math.log2(f/440));}
// Autocorrelation pitch detection, restricted to the piano-ish frequency range so the
// per-frame cost stays small enough to run continuously in the browser.
function detectPitch(buf,sampleRate){
  const SIZE=buf.length;
  let rms=0;for(let i=0;i<SIZE;i++)rms+=buf[i]*buf[i];
  rms=Math.sqrt(rms/SIZE);
  if(rms<MIC_SILENCE_RMS)return null;
  let c0=0;for(let i=0;i<SIZE;i++)c0+=buf[i]*buf[i];
  if(c0===0)return null;
  const corr=lag=>{let s=0;for(let i=0;i<SIZE-lag;i++)s+=buf[i]*buf[i+lag];return s;};
  const minLag=Math.max(1,Math.floor(sampleRate/MIC_MAX_HZ)),maxLag=Math.min(SIZE-2,Math.ceil(sampleRate/MIC_MIN_HZ));
  let best=-Infinity,bestLag=-1;
  for(let lag=minLag;lag<=maxLag;lag++){const s=corr(lag);if(s>best){best=s;bestLag=lag;}}
  if(bestLag<0||best/c0<MIC_MIN_CONF)return null;
  let T0=bestLag;
  if(bestLag>minLag&&bestLag<maxLag){
    const x1=corr(bestLag-1),x2=best,x3=corr(bestLag+1),a=(x1+x3-2*x2)/2,b=(x3-x1)/2;
    if(a)T0=bestLag-b/(2*a);
  }
  return sampleRate/T0;
}
// Practice's Wait mode can only be graded by mic one note at a time: a chord (two
// hands landing together, or a coincident onset) needs simultaneous pitches that
// autocorrelation can't pull apart, so those steps are left for tap or MIDI instead
// of risking a false "wrong". updateMicChordHint() shows/hides the explanation.
function practiceMicNote(m){
  if(activeTab!=='practice'||transport.mode!=='wait'||transport.need.size!==1)return;
  const el=keyEl(kbP,m);if(el)flash(el,'down',160);
  practiceKey(m,'mic');
}
function updateMicChordHint(){
  const hint=$('mic-chord-hint');if(!hint)return;
  hint.hidden=!(micStream&&activeTab==='practice'&&transport.mode==='wait'&&transport.need&&transport.need.size>1);
}
function micNoteOn(m){
  if(activeTab==='read'){
    if(handsModeSel.value==='2')return;
    const el=keyEl(kb,m);if(el)flash(el,'down',160);
    answerKey(m,'mic');
  }else if(activeTab==='practice'){
    practiceMicNote(m);
  }
}
function micTick(){
  if(!micAnalyser||(activeTab!=='read'&&activeTab!=='practice'))return;
  micAnalyser.getFloatTimeDomainData(micBuf);
  const freq=detectPitch(micBuf,ctx.sampleRate);
  if(freq==null){micArmed=true;micStableNote=null;micStableCount=0;return;}
  const m=freqToMidi(freq);
  micStableCount=(m===micStableNote)?micStableCount+1:1;
  micStableNote=m;
  if(micArmed&&micStableCount>=MIC_STABLE_FRAMES){micArmed=false;micNoteOn(m);}
}
function stopMic(){
  if(micLoopId)clearInterval(micLoopId);micLoopId=null;
  if(micStream)micStream.getTracks().forEach(t=>t.stop());micStream=null;
  micAnalyser=null;micBuf=null;
  micStatus('Mic off','');micBtns().forEach(b=>b.textContent='Listen with mic');
  updateMicChordHint();
}
async function connectMic(){
  if(micStream){stopMic();return;}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){micStatus('No mic in this browser','err');return;}
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  }catch(e){
    const msg=String(e&&e.name||e);
    micStatus(msg.includes('NotAllowed')?'Microphone permission refused':'Microphone unavailable','err');
    return;
  }
  const c=audio(),src=c.createMediaStreamSource(micStream);
  micAnalyser=c.createAnalyser();micAnalyser.fftSize=2048;
  micBuf=new Float32Array(micAnalyser.fftSize);
  src.connect(micAnalyser);
  micArmed=true;micStableNote=null;micStableCount=0;
  micLoopId=setInterval(micTick,60);
  micStatus('Listening','on');micBtns().forEach(b=>b.textContent='Stop mic');
  updateMicChordHint();
}
micBtns().forEach(b=>b.addEventListener('click',connectMic));
if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){micStatus('No mic in this browser','err');micBtns().forEach(b=>b.disabled=true);}

// ---------- photo transcription (claude.ai only) ----------
const photoIn=$('photo-in'),photoPrev=$('photo-prev'),btnTr=$('btn-transcribe'),aiStatus=$('ai-status'),aiOut=$('ai-out');
let sampleFn=null,photoFile=null;
const TRANSCRIBE_PROMPT=`You are transcribing a photo of printed piano sheet music for a beginner practice app. Read the music note by note, bar by bar, and write it in this exact text notation.

Rules of the notation:
- Note = pitch/length. Pitch is a letter A to G, an optional accidental (# sharp, b flat, n natural), and the octave number where middle C is C4 (the C below middle C is C3, the C above is C5). Length: w whole, h half, q quarter, e eighth, s sixteenth; add a dot for dotted, e.g. C4/q. means dotted quarter.
- Rest: r/q, r/h, and so on.
- Chord (several notes on one stem): [C4 E4 G4]/h
- Tie to the next note: add ~ after the length, e.g. C4/h~
- Bars are separated by " | ". Every bar must add up to the time signature.
- Write accidentals exactly as printed on each note. Notes without an accidental follow the key signature, which you give in the key line.
- RH is the treble (upper) staff, LH the bass (lower) staff. If the photo shows only one staff, give only RH.
- Triplet or other tuplet: the count, then the notes in round brackets: 3(C4/e D4/e E4/e) is three eighths in the time of two. Rests and chords may sit inside.
- Two voices on one staff (for example a held note under a moving line, or a chord held while other notes move): write the moving line on RH or LH and the held voice on RH2 or LH2, with exactly the same number of bars, using rests where that voice is silent. Give rh2 or lh2 only when the page really has two voices.
- Leave out grace notes and ornaments.
- Keep beams as separate eighth notes. Ignore fingering numbers, dynamics, slurs, lyrics, chord symbols, repeat signs and pedal marks.

Reply with only a JSON object of this shape, no commentary:
{"title":"name printed on the page or Untitled","time":"4/4","key":"C","tempo":72,"rh":"E4/q E4/q F4/q G4/q | G4/q F4/q E4/q D4/q","lh":"C3/h G3/h | C3/h G3/h","rh2":"","lh2":"","notes":"one sentence on anything you were unsure about, or empty"}
Use the printed tempo if there is one, otherwise a slow practice tempo between 60 and 80. Transcribe every bar in the photo, in order.`;
async function initSample(){
  if(!(window.claude&&typeof window.claude.use==='function'))return;
  try{
    const s=await window.claude.use('sample');if(!s)return;
    const caps=await s.limits().catch(()=>null);if(!caps||!caps.images)return;
    sampleFn=s;photoIn.accept=caps.images.mediaTypes.join(',');
    $('photo-card').hidden=false;$('nophoto-card').hidden=true;
  }catch(e){}
}
photoIn.addEventListener('change',()=>{
  photoFile=photoIn.files&&photoIn.files[0]||null;btnTr.disabled=!photoFile;
  if(photoFile){photoPrev.src=URL.createObjectURL(photoFile);photoPrev.hidden=false;}else photoPrev.hidden=true;
  aiOut.textContent='';aiStatus.textContent='';
});
btnTr.addEventListener('click',async()=>{
  if(!sampleFn||!photoFile)return;
  btnTr.disabled=true;aiStatus.textContent='Reading the page…';aiOut.textContent='';
  try{
    const r=await sampleFn.json(TRANSCRIBE_PROMPT,{images:[photoFile],modelTier:'complex',cache:false,onText:({text})=>{aiOut.textContent=text;}});
    const lines=[`title: ${r.title||'Untitled'}`,`time: ${r.time||'4/4'}`,`key: ${r.key||'C'}`,`tempo: ${r.tempo||72}`];
    if(r.rh)lines.push(`RH: ${r.rh}`);if(r.rh2)lines.push(`RH2: ${r.rh2}`);if(r.lh)lines.push(`LH: ${r.lh}`);if(r.lh2)lines.push(`LH2: ${r.lh2}`);
    notationTa.value=lines.join('\n');
    pieceId='new';$('btn-load').click();
    aiStatus.textContent='Loaded. Check it against the page: '+(r.notes||'no doubts reported.')+' On your tablet? Scroll down to Copy notation and paste it into that copy.';
    aiOut.textContent='';
  }catch(e){
    const code=e&&e.code;
    aiStatus.textContent=code==='not_granted'?'Claude access was not allowed for this page.':code==='rate_limited'?'Too many requests, wait a minute.':code==='invalid_json'?'Claude did not return usable notation. Try a clearer or smaller photo.':code==='refused'?'Claude declined to read this image.':'Transcription failed: '+(e&&e.message||code||e);
    if(e&&e.text)aiOut.textContent=e.text;
  }
  btnTr.disabled=false;
});

// ---------- progress ----------
// One score cell: the label, then correct over attempts, shaded by how it is going.
function cell(label,s){
  const d=document.createElement('div');
  let cls='none';if(s.n){const r=s.ok/s.n;cls=r>=0.9?'hi':r>=0.7?'mid':'lo';}
  d.className='cell '+cls;d.innerHTML=`<b>${label}</b>${s.n?s.ok+'/'+s.n:'\u2013'}`;
  return d;
}
function renderEarProgress(){
  const keys=Object.keys(store.ear);
  const n=keys.reduce((a,k)=>a+store.ear[k].n,0),ok=keys.reduce((a,k)=>a+store.ear[k].ok,0);
  $('e-total').textContent=n;$('e-total-acc').textContent=n?Math.round(100*ok/n)+'%':'\u2013';
  const gi=$('grid-int');gi.innerHTML='';
  INTERVALS.forEach(iv=>gi.appendChild(cell(iv.ab,earStat('int:'+iv.s))));
  const gn=$('grid-earnote');gn.innerHTML='';
  const notes=keys.filter(k=>k.startsWith('note:')).map(k=>+k.slice(5)).sort((a,b)=>a-b);
  notes.forEach(m=>gn.appendChild(cell(noteName(m),earStat('note:'+m))));
  $('earnote-empty').hidden=notes.length>0;
  const gaps={close:'one or two keys',mid:'three to five',wide:'six or more'};
  $('ear-hl-line').textContent=Object.keys(gaps).map(b=>{
    const s=earStat('hl:'+b);return `${gaps[b]} ${s.n?s.ok+'/'+s.n:'\u2013'}`;
  }).join(' \u00b7 ');
}
function renderProgress(){
  const log=store.log,n=log.length,ok=log.filter(x=>x.ok).length;
  $('p-total').textContent=n;$('p-acc').textContent=n?Math.round(100*ok/n)+'%':'–';
  const rec=log.slice(-50);$('p-recent').textContent=rec.length?Math.round(100*rec.filter(x=>x.ok).length/rec.length)+'%':'–';
  const times=rec.filter(x=>x.ok).map(x=>x.ms).sort((a,b)=>a-b);$('p-time').textContent=times.length?(times[Math.floor(times.length/2)]/1000).toFixed(1):'–';
  ['treble','bass'].forEach(c=>{const g=$('grid-'+c);g.innerHTML='';POOL[c].ledger.forEach(m=>g.appendChild(cell(noteName(m),stat(m,c))));});
  renderEarProgress();
  const tb=$('piece-rows');tb.innerHTML='';
  pieceList().forEach(p=>{const s=store.pieceStats[p.id];const tr=document.createElement('tr');tr.innerHTML=`<td>${titleOf(p.text)}</td><td>${s?s.runs:0}</td><td>${s?s.last:'–'}</td><td>${s?new Date(s.at).toLocaleDateString():'–'}</td>`;tb.appendChild(tr);});
}
$('reset').addEventListener('click',()=>{if(!confirm('Delete all saved progress in this browser? Your saved pieces stay.'))return;store.notes={};store.log=[];store.pieceStats={};store.ear={};save();renderProgress();});

// ---------- install (PWA) ----------
(function(){
  const btn=$('install'),help=$('install-help'),closeBtn=$('ih-close');
  const embedded=window.top!==window.self;
  const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  const isIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  let deferred=null;
  const show=()=>{if(!embedded&&!standalone())btn.hidden=false;};
  const openHelp=()=>{
    // an installed-capable browser still gets the list; hide the arm that cannot apply
    $('ih-ios').hidden=$('ih-ios-step').hidden=!isIOS()&&!!deferred;
    help.hidden=false;closeBtn.focus();
  };
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;show();});
  window.addEventListener('appinstalled',()=>{btn.hidden=true;help.hidden=true;deferred=null;});
  btn.addEventListener('click',async()=>{
    if(deferred){
      deferred.prompt();
      try{const {outcome}=await deferred.userChoice;if(outcome==='accepted')btn.hidden=true;}catch(e){}
      deferred=null;return;
    }
    openHelp();
  });
  closeBtn.addEventListener('click',()=>{help.hidden=true;btn.focus();});
  help.addEventListener('click',e=>{if(e.target===help)help.hidden=true;});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!help.hidden)help.hidden=true;});
  // iOS never fires beforeinstallprompt, so offer the manual route
  if(isIOS())show();
})();

// ---------- focus mode ----------
// Hides secondary chrome so the keyboard gets more room, and also requests real
// browser fullscreen where supported. iPad Safari has no Fullscreen API for
// arbitrary elements, so the declutter class is what actually helps there.
(function(){
  const d=document.documentElement,app=document.querySelector('.app'),btn=$('fs');
  const req=d.requestFullscreen||d.webkitRequestFullscreen,exit=document.exitFullscreen||document.webkitExitFullscreen;
  const inFs=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
  const setLabel=()=>{btn.textContent=app.classList.contains('focus')?'Exit focus mode':'Focus mode';};
  let on=false;try{on=localStorage.getItem(KEY+':focus')==='1';}catch(e){}
  app.classList.toggle('focus',on);setLabel();
  btn.addEventListener('click',()=>{
    on=!app.classList.contains('focus');app.classList.toggle('focus',on);setLabel();
    try{localStorage.setItem(KEY+':focus',on?'1':'0');}catch(e){}
    if(req){try{on&&!inFs()?req.call(d):!on&&inFs()&&exit.call(document);}catch(e){}}
    setTimeout(()=>window.dispatchEvent(new Event('resize')),100);
  });
  ['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{
    if(!inFs()&&app.classList.contains('focus')){app.classList.remove('focus');setLabel();try{localStorage.setItem(KEY+':focus','0');}catch(e){}}
    setTimeout(()=>window.dispatchEvent(new Event('resize')),100);
  }));
})();
